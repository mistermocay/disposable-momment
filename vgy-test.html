<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VGY.me Upload Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    #result {
      margin-top: 25px;
    }

    #result img {
      display: block;
      max-width: 100%;
      max-height: 500px;
      margin-top: 15px;
      border-radius: 12px;
    }

    .url-box {
      margin-top: 15px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      word-break: break-all;
    }

    .warning {
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 8px;
      font-size: 14px;
    }

    pre {
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>VGY.me Upload Test</h1>

    <p>
      Temporary testing page for Disposable Momment.
    </p>


    <!-- USER KEY -->

    <div class="field">

      <label for="userKey">
        VGY User Key
      </label>

      <input
        id="userKey"
        type="password"
        placeholder="21XiP41Fe1hRtk7mZtaEJzw1f1OU2pwHGvRyQiffBqa6FZe3yVUQRchxM6ifQDj9"
        autocomplete="off"
      >

    </div>


    <!-- IMAGE -->

    <div class="field">

      <label for="imageInput">
        Select Image
      </label>

      <input
        id="imageInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

    </div>


    <!-- UPLOAD -->

    <button
      id="uploadButton"
    >
      Upload to VGY.me
    </button>


    <!-- STATUS -->

    <div id="status">
      Waiting for test...
    </div>


    <!-- RESULT -->

    <div id="result"></div>


    <div class="warning">

      <strong>Important:</strong>

      This page is only for testing.
      Do not put your VGY User Key directly
      into the main Disposable Momment website yet.

    </div>

  </div>


  <script>

    const userKeyInput =
      document.getElementById("userKey");


    const imageInput =
      document.getElementById("imageInput");


    const uploadButton =
      document.getElementById("uploadButton");


    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");


    uploadButton.addEventListener(
      "click",
      async function () {

        const userKey =
          userKeyInput.value.trim();


        const file =
          imageInput.files[0];


        // ==========================================
        // VALIDATION
        // ==========================================

        if (!userKey) {

          status.textContent =
            "Please enter your VGY User Key.";

          return;

        }


        if (!file) {

          status.textContent =
            "Please select an image.";

          return;

        }


        // ==========================================
        // RESET UI
        // ==========================================

        uploadButton.disabled = true;

        uploadButton.textContent =
          "Uploading...";


        status.textContent =
          "Preparing upload...";


        result.innerHTML = "";


        try {

          // ========================================
          // CREATE FORM DATA
          // ========================================

          const formData =
            new FormData();


          formData.append(
            "file",
            file
          );


          /*
           * TEST:
           *
           * We are trying "userkey"
           * as the authentication field.
           */

          formData.append(
            "userkey",
            userKey
          );


          status.textContent =
            "Sending request to VGY.me...";


          console.log(
            "Uploading file:",
            file.name
          );


          console.log(
            "File size:",
            file.size,
            "bytes"
          );


          // ========================================
          // SEND REQUEST
          // ========================================

          const response =
            await fetch(
              "https://vgy.me/upload",
              {
                method: "POST",
                body: formData
              }
            );


          console.log(
            "HTTP status:",
            response.status
          );


          // ========================================
          // READ RESPONSE
          // ========================================

          const rawText =
            await response.text();


          console.log(
            "Raw VGY response:",
            rawText
          );


          // ========================================
          // TRY JSON
          // ========================================

          let data = null;


          try {

            data =
              JSON.parse(rawText);

          } catch (jsonError) {

            console.warn(
              "Response was not valid JSON."
            );

          }


          // ========================================
          // DISPLAY RAW RESPONSE
          // ========================================

          result.innerHTML = `

            <h3>VGY Response</h3>

            <div class="url-box">

              <strong>HTTP Status:</strong>

              ${response.status}

            </div>

            <pre>${escapeHtml(rawText)}</pre>

          `;


          // ========================================
          // CHECK HTTP STATUS
          // ========================================

          if (!response.ok) {

            status.textContent =
              "UPLOAD FAILED\n\n" +
              "HTTP Status: " +
              response.status +
              "\n\n" +
              rawText;

            return;

          }


          // ========================================
          // FIND IMAGE URL
          // ========================================

          const imageUrl =
            data &&
            (
              data.url ||
              data.image ||
              data.imageUrl ||
              data.hotlinkUrl
            );


          if (!imageUrl) {

            status.textContent =
              "Upload request succeeded, " +
              "but no image URL was found.";

            return;

          }


          // ========================================
          // SUCCESS
          // ========================================

          status.textContent =
            "UPLOAD SUCCESSFUL!";


          result.innerHTML += `

            <div class="url-box">

              <strong>Image URL:</strong>

              <br><br>

              ${escapeHtml(imageUrl)}

            </div>

            <img
              src="${escapeHtml(imageUrl)}"
              alt="Uploaded image"
            >

          `;


        } catch (error) {

          console.error(
            "VGY upload error:",
            error
          );


          status.textContent =
            "UPLOAD ERROR\n\n" +
            error.message;


          result.innerHTML += `

            <pre>
${escapeHtml(error.stack || error.toString())}
            </pre>

          `;


        } finally {

          uploadButton.disabled = false;

          uploadButton.textContent =
            "Upload to VGY.me";

        }

      }
    );


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>

</html>
