<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VGY.me Upload Test</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      margin: 20px 0;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    #preview {
      margin-top: 30px;
      max-width: 100%;
    }

    #preview img {
      max-width: 100%;
      border-radius: 10px;
    }

    #resultUrl {
      word-break: break-all;
      margin-top: 15px;
    }

  </style>

</head>


<body>

  <h1>VGY.me Upload Test</h1>

  <p>
    Test upload image dari browser ke VGY.me.
  </p>


  <input
    id="imageInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
  >


  <br>


  <button
    id="uploadButton"
  >
    Upload Image
  </button>


  <div id="status">
    Waiting for image...
  </div>


  <div id="resultUrl"></div>


  <div id="preview"></div>


  <script>

    const imageInput =
      document.getElementById("imageInput");

    const uploadButton =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const resultUrl =
      document.getElementById("resultUrl");

    const preview =
      document.getElementById("preview");


    uploadButton.addEventListener(
      "click",
      async function() {

        const file =
          imageInput.files[0];


        if (!file) {

          status.textContent =
            "Please select an image first.";

          return;

        }


        status.textContent =
          "Uploading...";

        resultUrl.innerHTML = "";
        preview.innerHTML = "";


        try {

          const formData =
            new FormData();


          formData.append(
            "file",
            file
          );


          const response =
            await fetch(
              "https://vgy.me/upload",
              {
                method: "POST",
                body: formData
              }
            );


          console.log(
            "VGY response status:",
            response.status
          );


          const text =
            await response.text();


          console.log(
            "VGY raw response:",
            text
          );


          if (!response.ok) {

            throw new Error(
              `Upload failed with HTTP ${response.status}`
            );

          }


          let data;

          try {

            data =
              JSON.parse(text);

          } catch {

            throw new Error(
              "VGY.me returned a non-JSON response."
            );

          }


          console.log(
            "VGY parsed response:",
            data
          );


          /*
           * Try common response fields.
           */
          const imageUrl =
            data.image ||
            data.url ||
            data.imageUrl ||
            data.hotlinkUrl;


          if (!imageUrl) {

            throw new Error(
              "Upload succeeded but no image URL was found in the response."
            );

          }


          status.textContent =
            "Upload successful!";


          resultUrl.innerHTML = `
            <strong>Image URL:</strong><br>
            ${imageUrl}
          `;


          preview.innerHTML = `
            <h3>Preview</h3>
            <img
              src="${imageUrl}"
              alt="Uploaded image"
            >
          `;


        } catch (error) {

          console.error(
            "VGY upload error:",
            error
          );


          status.textContent =
            "UPLOAD FAILED\n\n" +
            error.message;

        }

      }
    );

  </script>

</body>

</html>
